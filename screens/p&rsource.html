<section id="screen-source" class="screen active">
    <header class="screen-header">
        <button id="excelBtn" class="pill small">EXCEL</button>
        <h1 id="sourceTitle">CHOOSE SOURCE FOR P&R :</h1>
    </header>
    <div id="sourceGrid" class="grid grid-3 source-grid">
        <div class="card" data-source-card="silo">
            <h2>SILO / BULK BITCH:</h2>
            <div class="btn-col" data-group="silo">
                <button class="btn option" data-value="A">A</button>
                <button class="btn option" data-value="B">B</button>
                <button class="btn option" data-value="C">C</button>
                <button class="btn option" data-value="D">D</button>
            </div>
        </div>
        <div class="card" data-source-card="dryer">
            <h2>DRYER:</h2>
            <div class="btn-col" data-group="dryer">
                <button class="btn option" data-value="A">A</button>
                <button class="btn option" data-value="B">B</button>
                <button class="btn option" data-value="C">C</button>
                <button class="btn option" data-value="D">D</button>
            </div>
        </div>
        <div class="card" data-source-card="compound">
            <h2>COMPOUND:</h2>
            <div class="btn-col" data-group="compound">
                <button class="btn option" data-value="A">A</button>
                <button class="btn option" data-value="B">B</button>
            </div>
        </div>
    </div>
    <footer class="screen-footer">
        <button id="btnReprint" class="btn secondary">Reprint</button>
        <button id="btnReissue" class="btn secondary">Manual Entry</button>
        <button id="btnReissueNew" class="btn secondary">Reissue</button>
        <button id="btnLogout" class="btn tertiary">Log out</button>
        <div class="spacer"></div>
        <div class="right-buttons">
            <button class="btn tertiary" data-special="Unextracted">
                Unextracted
            </button>
            <button class="btn tertiary" data-special="Lactam">Lactam</button>
            <button id="btnNextFromSource" class="btn primary">Next</button>
        </div>
    </footer>

    <div id="reissueSearchModal" class="modal-backdrop hidden">
        <div class="modal">
            <h3>Reissue search</h3>
            <label style="display: grid; gap: 8px; font-weight: 600">
                BOX NUMBER
                <input
                    id="reissueBoxSearch"
                    type="text"
                    placeholder="Enter box number"
                    style="padding: 12px"
                />
            </label>
            <div
                id="reissueSearchError"
                class="muted-text"
                style="color: #b00020; margin-top: 8px"
            ></div>
            <div class="row" style="margin-top: 12px">
                <button id="reissueCancelSearch" class="btn secondary">
                    Cancel
                </button>
                <div class="spacer"></div>
                <button id="reissueSearchBtn" class="btn primary">
                    Search
                </button>
            </div>
        </div>
    </div>

    <div id="reissueEditModal" class="modal-backdrop hidden">
        <div class="modal">
            <h3>Reissue details</h3>
            <div id="reissueOriginalBox" class="muted-text"></div>
            <div id="reissueSourceMeta" class="muted-text"></div>
            <div class="form" style="margin-top: 12px">
                <label>
                    BOX NUMBER.
                    <input
                        id="reissueUnitNumber"
                        type="text"
                        placeholder="Box number"
                    />
                </label>
                <label>
                    PRODUCT
                    <select id="reissueProduct"></select>
                </label>
                <label>
                    NET WEIGHT (LBS.)
                    <input
                        id="reissueNet"
                        type="number"
                        inputmode="decimal"
                        placeholder="0"
                    />
                </label>
                <label>
                    GROSS WEIGHT (LBS.)
                    <input
                        id="reissueGross"
                        type="number"
                        inputmode="decimal"
                        placeholder="0"
                    />
                </label>
                <label>
                    TARE WEIGHT (LBS.)
                    <input
                        id="reissueTare"
                        type="number"
                        inputmode="decimal"
                        placeholder="0"
                        disabled
                    />
                </label>
            </div>
            <div
                id="reissueEditError"
                class="form-error"
                role="alert"
                aria-live="polite"
            ></div>
            <div class="row" style="margin-top: 12px">
                <button id="reissueCancelEdit" class="btn secondary">
                    Cancel
                </button>
                <div class="spacer"></div>
                <button id="reissueConfirm" class="btn primary">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Reissue New Boxx: lot entry. -->
    <div id="reissueNewModal" class="modal-backdrop hidden">
        <div class="modal">
            <h3>Enter lot number for reissue</h3>
            <div class="form" style="margin-top: 12px">
                <label>
                    SOURCE
                    <select id="reissueNewSource">
                        <option value="">Select source</option>
                        <option value="EA">EA</option>
                        <option value="AC">AC</option>
                        <option value="AD">AD</option>
                        <option value="BD">BD</option>
                        <option value="CD">CD</option>
                        <option value="DE">DE</option>
                        <option value="AS">AS</option>
                        <option value="BS">BS</option>
                        <option value="CS">CS</option>
                        <option value="DS">DS</option>
                        <option value="BC">BC</option>
                        <option value="UX">UX</option>
                        <option value="LT">LT</option>
                    </select>
                </label>
                <label>
                    YEAR
                    <input
                        id="reissueNewYear"
                        type="number"
                        inputmode="numeric"
                        placeholder="2025"
                    />
                </label>
                <label>
                    DAY
                    <input
                        id="reissueNewDay"
                        type="number"
                        inputmode="numeric"
                        placeholder="324"
                    />
                </label>
                <label>
                    BOX #
                    <input
                        id="reissueNewBox"
                        type="number"
                        inputmode="numeric"
                        placeholder="003"
                    />
                </label>
            </div>
            <div
                id="reissueNewError"
                class="form-error"
                role="alert"
                aria-live="polite"
            ></div>
            <div class="row" style="margin-top: 12px">
                <button id="reissueNewClear" class="btn secondary">
                    Clear
                </button>
                <div class="spacer"></div>
                <!-- 
                <button id="reissueNewManualEntry" class="btn secondary">
                    Manual Entry
                </button>
                -->

                <button id="reissueNewSearch" class="btn primary">
                    Search
                </button>
            </div>
        </div>
    </div>

    <!-- Shared operator prompts (used by Reissue New + Preview Modify) -->
    <div id="operatorPasswordModal" class="modal-backdrop hidden">
        <div class="modal">
            <h3 id="operatorPasswordTitle">Enter password</h3>
            <input
                id="operatorPasswordInput"
                type="password"
                placeholder="Password"
                style="padding: 10px"
            />
            <div
                id="operatorPasswordError"
                class="muted-text"
                style="color: #b00020; margin-top: 8px"
            ></div>
            <div class="row" style="margin-top: 12px">
                <button id="operatorPasswordCancel" class="btn secondary">
                    Cancel
                </button>
                <div class="spacer"></div>
                <button id="operatorPasswordConfirm" class="btn primary">
                    Enter
                </button>
            </div>
        </div>
    </div>

    <div id="operatorLotModal" class="modal-backdrop hidden">
        <div class="modal">
            <h3 id="operatorLotTitle">Enter lot number</h3>
            <input
                id="operatorLotInput"
                type="text"
                placeholder="AD15324003"
                style="padding: 10px"
                autocomplete="off"
            />
            <div
                id="operatorLotError"
                class="muted-text"
                style="color: #b00020; margin-top: 8px"
            ></div>
            <div class="row" style="margin-top: 12px">
                <button id="operatorLotCancel" class="btn secondary">
                    Cancel
                </button>
                <div class="spacer"></div>
                <button id="operatorLotConfirm" class="btn primary">
                    Enter
                </button>
            </div>
        </div>
    </div>

    <div id="operatorConfirmModal" class="modal-backdrop hidden">
        <div class="modal">
            <h3 id="operatorConfirmTitle">Confirm</h3>
            <div id="operatorConfirmMessage" style="margin-top: 8px"></div>
            <div class="row" style="margin-top: 12px">
                <button id="operatorConfirmNo" class="btn secondary">No</button>
                <div class="spacer"></div>
                <button id="operatorConfirmYes" class="btn primary">Yes</button>
            </div>
        </div>
    </div>
</section>
