<section id="screen-auth" class="screen">
    <header class="screen-headers">
        <h1 class="auth-logo">
            <img
                src="https://nylene.com/wp-content/uploads/2023/03/NYLENE-LOGO-Web.svg"
                alt="Nylene"
                width="20%"
            />
        </h1>
    </header>
    <div class="card" style="max-width: 480px; margin: 0 auto">
        <div style="gap: 12px; align-items: center">
            <div>
                <label
                    for="authEmail"
                    style="min-width: 100px; font-weight: 600"
                    >Email</label
                >
            </div>
            <div>
                <input
                    id="authEmail"
                    type="email"
                    placeholder="Enter email"
                    value="labelprinter@nylene.com"
                    style="padding: 10px"
                />
            </div>
        </div>
        <div style="gap: 12px; align-items: center; margin-top: 12px">
            <div>
                <label
                    for="authPassword"
                    style="min-width: 100px; font-weight: 600"
                    >Password</label
                >
            </div>
            <div>
                <div class="password-field">
                    <input
                        id="authPassword"
                        class="password-field__input"
                        type="password"
                        placeholder="Enter password"
                        style="padding: 10px"
                    />
                    <button
                        id="authPasswordToggle"
                        class="password-toggle"
                        type="button"
                        aria-label="Show password"
                        aria-pressed="false"
                        title="Show password"
                    >
                        <svg
                            class="password-toggle__icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path
                                d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"
                            ></path>
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                class="password-toggle__slash hidden"
                                d="M4 4l16 16"
                            ></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div style="margin-top: 16px; gap: 16px">
            <label style="display: flex; align-items: center; gap: 8px">
                <input id="chkPR" type="checkbox" />
                <span>P&R</span>
            </label>
        </div>
        <div style="margin-top: 16px; gap: 16px">
            <label style="display: flex; align-items: center; gap: 8px">
                <input id="chkCoperion" type="checkbox" />
                <span>Extrusion</span>
            </label>
        </div>
        <div
            id="authError"
            class="muted-text"
            style="color: #b00020; margin-top: 8px"
        ></div>
        <div class="row" style="margin-top: 16px">
            <div class="spacer"></div>
            <button id="btnAuthLogin" class="btn primary">Log in</button>
        </div>
    </div>
</section>
